name: Tests and build checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install runtime and test dependencies
        run: python -m pip install -e ".[dev,proxy]"
      - name: Run Python tests
        # Real SLM tests self-skip when Ollama/qwen3 is unavailable. No model
        # downloads, external API credentials, or GPU are required by this job.
        run: python -m pytest tests -q
      - name: Check synchronized release versions
        run: python scripts/check_release_version.py

  frontend:
    name: Frontend tests and production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src-ui/package-lock.json
      - run: npm ci --prefix src-ui
      - run: npm --prefix src-ui test
      - run: npm --prefix src-ui run build

  platform-smoke:
    name: Release metadata (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pytest>=8"
      - name: Check packaging metadata and icons
        # This checks release inputs, not native service lifecycle or GUI behavior.
        run: python -m pytest tests/test_release_version.py tests/test_windows_desktop.py -q
